<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống - SmartHome IoT</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2.1)}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1.5rem;
            position: relative;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-2xl);
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05), var(--shadow-inner-refract);
            position: relative;
            z-index: 10;
        }

        .login-brand-header {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-brand-icon {
            width: 58px;
            height: 58px;
            border-radius: var(--radius-xl);
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(56, 189, 248, 0.1));
            border: 1px solid rgba(56, 189, 248, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.25), var(--shadow-inner-refract);
        }

        .login-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .login-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .login-alert {
            padding: 0.85rem 1.15rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .login-alert-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.35);
            color: var(--status-danger);
        }

        .login-alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: var(--status-success);
        }

        .credentials-hint {
            margin-top: 1.75rem;
            padding: 1rem;
            border-radius: var(--radius-lg);
            background: rgba(241, 245, 249, 0.85);
            border: 1px solid var(--border-glass);
            font-size: 0.82rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Brand Header -->
            <div class="login-brand-header">
                <div class="login-brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <h1 class="login-title">SmartHome IoT</h1>
                <p class="login-subtitle">Đăng nhập vào Trung tâm Quản trị Nhà thông minh</p>
            </div>

            <!-- Error and Logout Alerts -->
            <div th:if="${param.error}" class="login-alert login-alert-error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>Tên đăng nhập hoặc mật khẩu không chính xác.</span>
            </div>
            
            <div th:if="${param.logout}" class="login-alert login-alert-success">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span>Đã đăng xuất phiên làm việc an toàn.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login-action}" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Tài khoản</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Tên đăng nhập..." required autofocus>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Mật khẩu bảo mật..." required>
                </div>

                <button type="submit" class="btn btn-action" style="padding: 0.95rem; font-size: 1rem;">
                    <span>Xác Thực & Đăng Nhập</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </button>
            </form>

            <div class="credentials-hint">
                Tài khoản mặc định: <span class="font-mono" style="color: var(--accent-cyan);">admin</span> / Mật khẩu: <span class="font-mono" style="color: var(--accent-cyan);">123456</span>
            </div>

        </div>
    </div>

</body>
</html>
