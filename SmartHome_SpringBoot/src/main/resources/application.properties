# ==========================================
# CẤU HÌNH SERVER CỔNG HTTP
# ==========================================
server.port=8080
spring.application.name=SmartHome_SpringBoot

# ==========================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smarthome_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=10092005Long
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate / JPA (tự động tạo và cập nhật bảng)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CẤU HÌNH ECLIPSE MOSQUITTO MQTT BROKER
# ==========================================
mqtt.broker.url=tcp://broker.emqx.io:1883
mqtt.client.id=smarthome_spring_backend
mqtt.username=
mqtt.password=
# Topics lắng nghe dữ liệu từ ESP32
mqtt.topic.sensor=smarthome/sensor
# Topics gửi lệnh điều khiển thiết bị
mqtt.topic.device.control=smarthome/device/control
# Topics nhận phản hồi trạng thái thiết bị
mqtt.topic.device.status=smarthome/device/status

# ==========================================
# CẤU HÌNH THYMELEAF & STATIC RESOURCES
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

